<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聴解練習 - 第5〜8課</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fdfbf7;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #4a4a4a;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .radio-custom:checked+div,
        .checkbox-custom:checked+div {
            background-color: #fce7f3;
            border-color: #f472b6;
            color: #db2777;
            font-weight: bold;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto glass-panel rounded-2xl p-6 md:p-10">
        <!-- Header -->
        <header class="text-center mb-10 border-b pb-6">
            <h1 class="text-3xl font-bold text-pink-600 mb-2">聴解練習 (Latihan Choukai)</h1>
            <p class="text-gray-500">第5課〜第8課 (Bab 5 - 8)</p>
        </header>

        <!-- Form Data Siswa -->
        <section class="mb-10 bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">学生情報 (Data Siswa)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">名前 (Nama)</label>
                    <input type="text" id="studentName" placeholder="Masukkan nama Anda"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-300 focus:outline-none transition"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">クラス (Kelas)</label>
                    <input type="text" id="studentClass" placeholder="Contoh: XII Bahasa"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-300 focus:outline-none transition"
                        required>
                </div>
            </div>
        </section>

        <!-- Audio Player -->
        <section class="mb-10 bg-pink-50 p-6 rounded-xl border border-pink-100 flex flex-col items-center">
            <h2 class="text-lg font-medium mb-3 text-pink-800">オーディオを聴いてください (Dengarkan Audio)</h2>
            <audio controls class="w-full max-w-md rounded-full shadow-sm">
                <!-- Pastikan nama file audio Bab 5-8 Anda benar di bawah ini -->
                <source src="Audio 5-8.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung elemen audio.
            </audio>
        </section>

        <!-- Form Soal -->
        <form id="quizForm">
            <div id="questionsContainer" class="space-y-6">
                <!-- Soal dirender lewat JS -->
            </div>

            <!-- Tombol Kumpul -->
            <div class="mt-12 text-center">
                <button type="submit" id="submitBtn"
                    class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-10 rounded-full shadow-lg transform transition hover:-translate-y-1 hover:shadow-xl w-full md:w-auto text-lg">
                    提出する (Kumpulkan)
                </button>
            </div>
        </form>

        <!-- Loading -->
        <div id="loadingIndicator" class="hidden mt-6 text-center text-pink-600 font-medium">
            データを送信しています... (Sedang mengirim data...)
        </div>
    </div>

    <!-- Modal Hasil -->
    <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center transform transition-all scale-95 opacity-0"
            id="modalContent">
            <div class="text-6xl mb-4">🌸</div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">お疲れ様でした！</h3>
            <p class="text-gray-600 whitespace-pre-line mb-6" id="scoreText"></p>
            <button type="button" onclick="closeModal()"
                class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-6 rounded-full w-full transition">
                閉じる (Tutup)
            </button>
        </div>
    </div>

    <script>
        // DATA SOAL (SILAKAN MASUKKAN DATA BAGIAN 7-10 DI BAWAH JIKA ADA)
        const questionsData = [
            // BAGIAN 1: Waktu
            { isSection: true, title: "１。今、何時ですか。" },
            { type: "single", question: "1. 北京 (Beijing)", options: ["a) 2時半", "b) 1時半"], correctAnswer: 1 },
            { type: "single", question: "2. ロンドン (London)", options: ["a) 午前7時15分", "b) 午後1時15分"], correctAnswer: 0 },

            // BAGIAN 2: Hari Libur
            {
                isSection: true,
                title: "２。何時から何時までですか。休みは何曜日ですか。",
                exampleImage: "image_4d6eda.png"
            },
            {
                type: "schedule-single",
                question: "1) なにわ図書館",
                correctAnswers: [
                    ["9", "9:00", "09:00", "９", "9.00"], // Start
                    ["6", "6:00", "06:00", "６", "6.00"], // End
                    ["火", "火曜日"] // Day
                ]
            },
            {
                type: "schedule-double",
                question: "2) げんき病院",
                correctAnswers: [
                    ["9", "9:00", "09:00", "９", "9.00"], // AM Start
                    ["12", "12:00", "１２", "12.00"], // AM End
                    ["4:30", "4.30", "４：３０"], // PM Start
                    ["7:30", "7.30", "７：３０"], // PM End
                    ["日", "日曜日"] // Day
                ]
            },

            // BAGIAN 3: Pergi ke mana
            {
                isSection: true,
                title: "３。どこへ行きましたか。",
                exampleImage: "image_593c86.png"
            },
            { type: "single", question: "1. エドさん", options: ["a", "b", "c", "d", "e"], correctAnswer: 4 },
            { type: "single", question: "2. リンさん", options: ["a", "b", "c", "d", "e"], correctAnswer: 1 },
            { type: "single", question: "3. 先生", options: ["a", "b", "c", "d", "e"], correctAnswer: 3 },

            // BAGIAN 4: Hari Kerja
            {
                isSection: true,
                title: "４。林さんは何曜日に働きましたか。",
                exampleImage: "image_59a1a3.png",
                example: "働きました……〇  働きませんでした……✕"
            },
            { type: "single", question: "月曜日 (Senin)", options: ["〇", "✕"], correctAnswer: 0 },
            { type: "single", question: "火曜日 (Selasa)", options: ["〇", "✕"], correctAnswer: 0 },
            { type: "single", question: "水曜日 (Rabu)", options: ["〇", "✕"], correctAnswer: 1 },
            { type: "single", question: "木曜日 (Kamis)", options: ["〇", "✕"], correctAnswer: 0 },
            { type: "single", question: "金曜日 (Jumat)", options: ["〇", "✕"], correctAnswer: 1 },
            { type: "single", question: "土曜日 (Sabtu)", options: ["〇", "✕"], correctAnswer: 1 },
            { type: "single", question: "日曜日 (Minggu)", options: ["〇", "✕"], correctAnswer: 1 },

            // BAGIAN 5: Nomor Telepon
            {
                isSection: true,
                title: "５。何番ですか。",
                example: "例(れい)：03-3292-6521"
            },
            { type: "text-single", question: "1)", correctAnswers: ["090-985-3178", "0909853178", "090 985 3178"] },
            { type: "text-single", question: "2)", correctAnswers: ["078-4211-3168", "07842113168", "078 4211 3168"] },
            { type: "text-single", question: "3)", correctAnswers: ["336-8080", "3368080", "336 8080"] },

            // BAGIAN 6: Kapan dan Ke Mana
            {
                isSection: true,
                title: "６。いつ行きますか。",
                exampleImage: "image_5a7e9e.png",
                example: "例(れい)： 10日 ( 火 ) 曜日 どこへ： a. 京都"
            },
            {
                type: "date-day-place",
                question: "1)",
                options: ["a. 京都", "b. 図書館", "c. 病院", "d. 美術館"],
                correctTextDate: ["6", "６", "6日", "６日"],
                correctTextDay: ["金", "金曜日", "きんようび", "kin", "jumat"],
                correctRadio: 1 // b. 図書館
            },
            {
                type: "date-day-place",
                question: "2)",
                options: ["a. 京都", "b. 図書館", "c. 病院", "d. 美術館"],
                correctTextDate: ["14", "１４", "14日", "１４日"],
                correctTextDay: ["土", "土曜日", "どようび", "do", "sabtu"],
                correctRadio: 2 // c. 病院
            },
            {
                type: "date-day-place",
                question: "3)",
                options: ["a. 京都", "b. 図書館", "c. 病院", "d. 美術館"],
                correctTextDate: ["26", "２６", "26日", "２６日"],
                correctTextDay: ["木", "木曜日", "もくようび", "moku", "kamis"],
                correctRadio: 3 // d. 美術館
            },

            // ==========================================
            // PASTE SOAL BAGIAN 7, 8, 9, 10 ANDA DI SINI
            // ==========================================
            // BAGIAN 7: Kehidupan Asrama
            {
                isSection: true,
                title: "７。寮の生活はどうですか。",
                exampleImage: "mini_choukai/bab5-8/contoh_bag7.png",
                example: "例(れい)： タワポンの 食べ物 … a. ☺"
            },
            { type: "single", question: "1) エド - 食べ物", options: ["a. ☺", "b. ☹"], correctAnswer: 1 },
            { type: "single", question: "1) エド - 友達", options: ["a. ☺", "b. ☹"], correctAnswer: 0 },
            { type: "single", question: "2) リン - 部屋 / トイレ", options: ["a. ☺", "b. ☹"], correctAnswer: 1 },
        ];

        // URL GOOGLE APPS SCRIPT ANDA
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxo5pqQP4AnB2uZLQ1I0rLodD69UEu5yVNvXj5L8hCi4WE--MLW6SHSm9NDP6OctNHn/exec';

        // Logika Render UI
        const container = document.getElementById('questionsContainer');
        let questionIndex = 0;
        let totalScorableItems = 0;

        questionsData.forEach((item) => {
            if (item.isSection) {
                container.innerHTML += `
                    <div class="mt-10 mb-4 border-b-2 border-pink-200 pb-3">
                        <h3 class="text-xl font-bold text-pink-700">${item.title}</h3>
                        ${item.example ? `<p class="text-gray-700 mt-3 bg-pink-50 p-4 rounded-lg font-medium tracking-wide shadow-inner">${item.example}</p>` : ''}
                        ${item.exampleImage ? `
                            <div class="mt-4 p-4 bg-white rounded-lg border border-gray-200 shadow-sm">
                                <p class="text-gray-600 font-bold mb-3 text-sm">例 (Contoh):</p>
                                <img src="${item.exampleImage}" alt="Contoh Bagian" class="max-w-full h-auto rounded border border-gray-300" onerror="this.outerHTML='<div class=\\'p-4 bg-gray-50 text-gray-400 text-sm border-dashed border-2 text-center\\'>Gambar contoh <b>${item.exampleImage}</b> tidak ditemukan. Pastikan nama dan lokasi file sudah benar.</div>'">
                            </div>` : ''}
                    </div>
                `;
            } else if (item.type === "single") {
                const gridCols = item.options.length > 3 ? 'md:grid-cols-5' : 'md:grid-cols-2';
                container.innerHTML += `
                    <div class="bg-white p-5 md:p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition ml-0 md:ml-4">
                        <p class="font-bold text-gray-800 mb-4 text-lg">${item.question}</p>
                        <div class="grid grid-cols-2 ${gridCols} gap-3">
                            ${item.options.map((opt, i) => `
                                <label class="cursor-pointer relative">
                                    <input type="radio" name="q${questionIndex}" value="${i}" class="radio-custom sr-only" required>
                                    <div class="w-full border-2 border-gray-200 rounded-lg p-3 text-gray-700 hover:bg-gray-50 transition font-medium text-center">
                                        ${opt}
                                    </div>
                                </label>`).join('')}
                        </div>
                    </div>
                `;
                questionIndex++; totalScorableItems++;
            } else if (item.type === "schedule-single") {
                container.innerHTML += `
                    <div class="bg-white p-5 md:p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition ml-0 md:ml-4">
                        <p class="font-bold text-gray-800 mb-4 text-lg">${item.question}</p>
                        <div class="flex flex-col gap-3 font-medium text-gray-700 text-lg">
                            <div class="flex items-center gap-2">
                                <span>(</span>
                                <input type="text" name="q${questionIndex}_0" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-2 py-1 text-center w-16 text-pink-600 bg-gray-50 rounded" required>
                                <span>〜</span>
                                <input type="text" name="q${questionIndex}_1" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-2 py-1 text-center w-16 text-pink-600 bg-gray-50 rounded" required>
                                <span>)</span>
                            </div>
                            <div class="flex items-center gap-2 mt-2">
                                <span>(</span>
                                <input type="text" name="q${questionIndex}_2" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-2 py-1 text-center w-20 text-pink-600 bg-gray-50 rounded" required placeholder="...">
                                <span>) 曜日</span>
                            </div>
                        </div>
                    </div>
                `;
                questionIndex++; totalScorableItems += 3;
            } else if (item.type === "schedule-double") {
                container.innerHTML += `
                    <div class="bg-white p-5 md:p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition ml-0 md:ml-4">
                        <p class="font-bold text-gray-800 mb-4 text-lg">${item.question}</p>
                        <div class="flex flex-col gap-3 font-medium text-gray-700 text-lg">
                            <div class="flex items-center gap-2">
                                <span class="text-sm text-gray-500 w-10">午前</span>
                                <span>(</span>
                                <input type="text" name="q${questionIndex}_0" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-2 py-1 text-center w-16 text-pink-600 bg-gray-50 rounded" required>
                                <span>〜</span>
                                <input type="text" name="q${questionIndex}_1" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-2 py-1 text-center w-16 text-pink-600 bg-gray-50 rounded" required>
                                <span>)</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm text-gray-500 w-10">午後</span>
                                <span>(</span>
                                <input type="text" name="q${questionIndex}_2" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-2 py-1 text-center w-16 text-pink-600 bg-gray-50 rounded" required>
                                <span>〜</span>
                                <input type="text" name="q${questionIndex}_3" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-2 py-1 text-center w-16 text-pink-600 bg-gray-50 rounded" required>
                                <span>)</span>
                            </div>
                            <div class="flex items-center gap-2 mt-2 ml-12">
                                <span>(</span>
                                <input type="text" name="q${questionIndex}_4" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-2 py-1 text-center w-20 text-pink-600 bg-gray-50 rounded" required placeholder="...">
                                <span>) 曜日</span>
                            </div>
                        </div>
                    </div>
                `;
                questionIndex++; totalScorableItems += 5;
            } else if (item.type === "text-single") {
                container.innerHTML += `
                    <div class="bg-white p-5 md:p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition ml-0 md:ml-4">
                        <div class="flex items-center gap-4 font-bold text-gray-800 text-lg">
                            <span>${item.question}</span>
                            <input type="text" name="text_single_q${questionIndex}" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-4 py-2 flex-1 text-pink-600 bg-gray-50 rounded text-xl tracking-wider" required placeholder="...">
                        </div>
                    </div>
                `;
                questionIndex++; totalScorableItems++;
            } else if (item.type === "date-day-place") {
                // LOGIKA RENDER BAGIAN 6
                container.innerHTML += `
                    <div class="bg-white p-5 md:p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition ml-0 md:ml-4">
                        <div class="flex flex-wrap items-center gap-3 font-bold text-gray-800 text-lg mb-4">
                            <span>${item.question}</span>
                            <input type="text" name="date_q${questionIndex}" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-2 py-1 text-center w-16 text-pink-600 bg-gray-50 rounded" required placeholder="..."> <span>日</span>
                            <span>(</span>
                            <input type="text" name="day_q${questionIndex}" class="border-b-2 border-pink-300 focus:border-pink-500 outline-none px-2 py-1 text-center w-20 text-pink-600 bg-gray-50 rounded" required placeholder="...">
                            <span>) 曜日</span>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3">
                            ${item.options.map((opt, i) => `
                                <label class="cursor-pointer relative">
                                    <input type="radio" name="radio_q${questionIndex}" value="${i}" class="radio-custom sr-only" required>
                                    <div class="w-full border-2 border-gray-200 rounded-lg p-3 text-gray-700 hover:bg-gray-50 transition font-medium text-center">
                                        ${opt}
                                    </div>
                                </label>`).join('')}
                        </div>
                    </div>
                `;
                questionIndex++; totalScorableItems += 3;
            }
        });

        // Logika Submit Skor
        document.getElementById('quizForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const studentName = document.getElementById('studentName').value;
            const studentClass = document.getElementById('studentClass').value;
            const formData = new FormData(this);
            let correctAnswersCount = 0;
            let qIdx = 0;

            questionsData.forEach((item) => {
                if (item.type === "single" || item.type === "image-single") {
                    const answer = formData.get(`q${qIdx}`);
                    if (answer && parseInt(answer) === item.correctAnswer) {
                        correctAnswersCount++;
                    }
                    qIdx++;
                } else if (item.type === "schedule-single" || item.type === "schedule-double") {
                    item.correctAnswers.forEach((correctArr, idx) => {
                        const val = formData.get(`q${qIdx}_${idx}`);
                        const answer = val ? val.trim().toLowerCase() : "";
                        if (correctArr.some(correct => correct.toLowerCase() === answer)) {
                            correctAnswersCount++;
                        }
                    });
                    qIdx++;
                } else if (item.type === "text-single") {
                    const val = formData.get(`text_single_q${qIdx}`);
                    const textAnswer = val ? val.trim().toLowerCase() : "";
                    if (item.correctAnswers.some(correct => correct.toLowerCase() === textAnswer)) {
                        correctAnswersCount++;
                    }
                    qIdx++;
                } else if (item.type === "date-day-place") {
                    // LOGIKA PENILAIAN BAGIAN 6
                    const dVal = formData.get(`date_q${qIdx}`);
                    const dateAnswer = dVal ? dVal.trim().toLowerCase() : "";
                    if (item.correctTextDate.some(correct => correct.toLowerCase() === dateAnswer)) {
                        correctAnswersCount++;
                    }

                    const dayVal = formData.get(`day_q${qIdx}`);
                    const dayAnswer = dayVal ? dayVal.trim().toLowerCase() : "";
                    if (item.correctTextDay.some(correct => correct.toLowerCase() === dayAnswer)) {
                        correctAnswersCount++;
                    }

                    const radioAnswer = formData.get(`radio_q${qIdx}`);
                    if (radioAnswer && parseInt(radioAnswer) === item.correctRadio) {
                        correctAnswersCount++;
                    }
                    qIdx++;
                }
            });

            const finalScore = Math.round((correctAnswersCount / totalScorableItems) * 100);

            const dataToSend = new FormData();
            dataToSend.append('Nama', studentName);
            dataToSend.append('Kelas', studentClass);
            dataToSend.append('Bab', 'Bab 5-8'); // Pencatatan sebagai Bab 5-8
            dataToSend.append('Skor', finalScore);

            const submitBtn = document.getElementById('submitBtn');
            const loadingInd = document.getElementById('loadingIndicator');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');
            loadingInd.classList.remove('hidden');

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: dataToSend
            })
                .then(() => {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50');
                    loadingInd.classList.add('hidden');

                    showModal(finalScore);
                    document.getElementById('quizForm').reset();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                })
                .catch(error => {
                    alert('Terjadi kesalahan. Pastikan koneksi internet Anda stabil.');
                    console.error(error);
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50');
                    loadingInd.classList.add('hidden');
                });
        });

        // Animasi Modal
        function showModal(score) {
            const modal = document.getElementById('resultModal');
            const modalContent = document.getElementById('modalContent');
            document.getElementById('scoreText').innerText =
                `名前 (Nama): ${document.getElementById('studentName').value}\nクラス (Kelas): ${document.getElementById('studentClass').value}\n\nスコア (Skor): ${score} / 100`;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('resultModal');
            const modalContent = document.getElementById('modalContent');
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
    </script>
</body>

</html>
