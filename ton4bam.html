    <div id="loginBox" class="container" style="text-align: center;">
        <h2>UAS: Login Ujian CBT (BAM Enabled)</h2>
        <div style="background:#fff3cd; padding:15px; border-radius:10px; margin-bottom:15px; text-align:left;">
            <b>PERINGATAN MONITORING:</b> [3, 4]
            <ul>
                <li>Keluar Fullscreen: +10 Poin Risiko</li>
                <li>Pindah Tab: +20 Poin Risiko</li>
                <li>Kehilangan Fokus: +15 Poin Risiko</li>
                <li>DevTools: +30 Poin Risiko</li>

        <input type="text" id="studentName" placeholder="Nama Lengkap" style="padding:10px; width:80%;">
        <button onclick="startExam()"

            Ujian</button>
    </div>

    <div class="container" id="examContainer" style="display:none;">
        <div style="display:flex; justify-content:space-between;">
            <div id="timer">70:00</div>
            <div id="riskIndicator">Skor Risiko: 0</div>
        </div>
    <div id="questionArea">
        <div id="questionNumber"></div>
    
        <div id="passage"></div>
    
        <p class="question" id="questionText"></p>
    
        <div class="options" id="options"></div>
    
        <div id="orderStatus"></div>
    
        <div class="navigation">
            <button type="button" id="prevButton" onclick="previousQuestion()">
                Sebelumnya
            </button>
    
            <button type="button" id="nextButton" onclick="nextQuestion()">
                Berikutnya
            </button>
        </div>
    </div>
        <button onclick="finishExam()"
            style="margin-top:20px; padding:12px 30px; background:#e74c3c; color:white; border:none; border-radius:10px; cursor:pointer;">Selesai
            Ujian</button>
    </div>

    <div id="result" class="container"></div>

            // 67-70: Sinonim (underline)
            {

            },
            // 71-74: 並べ替え問題（susun kalimat）

            {

                options: ["に", "旅行", "春", "なったら"],
                answer: [2, 3, 0, 1]
                // 来年春になったら旅行にしましょう。
            },

            {
                text: "72. アニさんは ＿＿ <span class='blank-star'><span>☆</span></span> ＿＿ ＿＿ 言いました。",
                options: ["に", "友だち", "会う", "と"],
                answer: [1, 0, 2, 3]
                // アニさんは友だちに会うと言いました。
            },

            {
                text: "73. 部長は食堂で ＿＿ ＿＿ <span class='blank-star'><span>☆</span></span> ＿＿ です。",
                options: ["ばかり", "した", "を", "食事"],
                answer: [3, 2, 1, 0]
                // 部長は食堂で食事をしたばかりです。
            },

            {
                text: "74. ＿＿ ＿＿ ＿＿<span class='blank-star'><span>☆</span></span> ために、いっしょけんめい勉強しています。",
                options: ["する", "ごうかく", "しけん", "を"],
                answer: [2, 3, 1, 0]
                // しけんをごうかくするために、いっしょけんめい勉強しています。
            }
        ];
    

        let answers = new Array(questions.length).fill(null);

        current = 0;
        timeLeft = QUIZ_TIME;
        examFinished = false;
        examStarted = false;
        studentName = "";

        totalRiskScore = 0;
        activityLogs = [];


        // =====================================================
        // UTILITAS
        // =====================================================

        function isOrderQuestion(question) {
            return Array.isArray(question.answer);
        }

        function arraysEqual(first, second) {
            if (!Array.isArray(first) || !Array.isArray(second)) {
                return false;
            }

            if (first.length !== second.length) {
                return false;
            }

            return first.every((value, index) => value === second[index]);
        }

        function getCurrentAnswer() {
            const answer = answers[current];

            if (Array.isArray(answer)) {
                return answer;
            }

            return [];
        }


        // =====================================================
        // BAM / MONITORING
        // =====================================================

        function logActivity(type, points) {
            if (!examStarted || examFinished) {
                return;
            }

            const timestamp = new Date().toLocaleTimeString();

            totalRiskScore += points;

            activityLogs.push({
                time: timestamp,
                event: type,
                penalty: points
            });

            const riskIndicator = document.getElementById("riskIndicator");

            if (riskIndicator) {
                riskIndicator.innerText = `Skor Risiko: ${totalRiskScore}`;
            }

            console.log(`[BAM ALERT] ${type} terdeteksi. +${points} Poin.`);

            if (totalRiskScore >= 100) {
                alert("Batas risiko kecurangan terlampaui. Ujian dihentikan.");
                finishExam();
            }
        }

        document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
                logActivity("Pindah Tab", 20);
            }
        });

        window.addEventListener("blur", function () {
            logActivity("Kehilangan Fokus (Window Blur)", 15);
        });

        document.addEventListener("fullscreenchange", function () {
            if (
                examStarted &&
                !examFinished &&
                !document.fullscreenElement
            ) {
                logActivity("Keluar Mode Fullscreen", 10);

                alert(
                    "Peringatan: Tetap dalam mode Fullscreen untuk menjaga integritas!"
                );
            }
        });

        setInterval(function () {
            if (!examStarted || examFinished) {
                return;
            }

            if (window.outerWidth - window.innerWidth > 200) {
                logActivity("DevTools/AI Sidebar Terdeteksi", 30);
            }
        }, 2000);


        // =====================================================
        // MULAI UJIAN
        // =====================================================

        function startExam() {
            const agreeRule = document.getElementById("agreeRule");
            const nameInput = document.getElementById("studentName");

            if (!agreeRule.checked || nameInput.value.trim() === "") {
                alert("Lengkapi nama dan setujui aturan.");
                return;
            }

            studentName = nameInput.value.trim();
            examStarted = true;
            current = 0;
            timeLeft = QUIZ_TIME;  // Reset existing timeLeft variable

            document.getElementById("loginBox").style.display = "none";
            document.getElementById("examContainer").style.display = "block";

            // Fullscreen dapat ditolak browser, sehingga gunakan catch()
            if (document.documentElement.requestFullscreen) {
                document.documentElement
                    .requestFullscreen()
                    .catch(function (error) {
                        console.warn("Fullscreen gagal:", error);
                    });
            }

            loadQuestion();
            startTimer();
        }


        // =====================================================
        // MENAMPILKAN SOAL
        // =====================================================

        function loadQuestion() {
            const question = questions[current];

            const questionNumber =
                document.getElementById("questionNumber");

            const passageDiv =
                document.getElementById("passage");

            const questionText =
                document.getElementById("questionText");

            const optionsDiv =
                document.getElementById("options");

            const orderStatus =
                document.getElementById("orderStatus");

            const prevButton =
                document.getElementById("prevButton");

            const nextButton =
                document.getElementById("nextButton");

            questionNumber.innerText =
                `Soal ${current + 1} dari ${questions.length}`;

            /*
             * Gunakan innerHTML, bukan innerText, karena data soal
             * mengandung <u>, <strong>, <br>, dan <span>.
             */
            questionText.innerHTML = question.text;

            /*
             * Soal bacaan memiliki properti passage.
             * Soal biasa tidak memiliki passage.
             */
            if (question.passage) {
                passageDiv.innerHTML = question.passage;
                passageDiv.style.display = "block";
            } else {
                passageDiv.innerHTML = "";
                passageDiv.style.display = "none";
            }

            optionsDiv.innerHTML = "";
            orderStatus.innerHTML = "";
            orderStatus.style.display = "none";

            if (isOrderQuestion(question)) {
                renderOrderQuestion(question);
            } else {
                renderNormalQuestion(question);
            }

            prevButton.disabled = current === 0;

            if (current === questions.length - 1) {
                nextButton.innerText = "Selesai";
                nextButton.style.background = "#e74c3c";
            } else {
                nextButton.innerText = "Berikutnya";
                nextButton.style.background = "#3498db";
            }
        }


        // =====================================================
        // SOAL BIASA
        // =====================================================

        function renderNormalQuestion(question) {
            const optionsDiv =
                document.getElementById("options");

            const selectedAnswer =
                answers[current];

            question.options.forEach(function (option, index) {
                const button = document.createElement("button");

                button.type = "button";
                button.innerHTML = `${index + 1}. ${option}`;

                if (selectedAnswer === index) {
                    button.classList.add("selected");
                }

                button.addEventListener("click", function () {
                    answers[current] = index;
                    loadQuestion();
                });

                optionsDiv.appendChild(button);
            });
        }


        // =====================================================
        // SOAL SUSUN KALIMAT NOMOR 71-74
        // =====================================================

        function renderOrderQuestion(question) {
            const optionsDiv =
                document.getElementById("options");

            const orderStatus =
                document.getElementById("orderStatus");

            let selectedOrder = getCurrentAnswer();

            orderStatus.style.display = "block";

            function refreshOrderStatus() {
                if (selectedOrder.length === 0) {
                    orderStatus.innerHTML =
                        "Klik pilihan sesuai urutan kalimat.";
                    return;
                }

                const selectedText = selectedOrder
                    .map(function (optionIndex) {
                        return question.options[optionIndex];
                    })
                    .join(" → ");

                orderStatus.innerHTML = `
            <b>Urutan pilihan:</b><br>
            ${selectedText}
            <br>
            <button type="button" class="reset-order">
                Reset Urutan
            </button>
        `;

                const resetButton =
                    orderStatus.querySelector(".reset-order");

                resetButton.addEventListener("click", function () {
                    selectedOrder = [];
                    answers[current] = [];
                    renderOrderQuestion(question);
                });
            }

            question.options.forEach(function (option, index) {
                const button = document.createElement("button");

                button.type = "button";
                button.innerHTML = `${index + 1}. ${option}`;

                const selectedPosition =
                    selectedOrder.indexOf(index);

                if (selectedPosition !== -1) {
                    button.classList.add("selected");
                    button.innerHTML =
                        `${selectedPosition + 1}. ${option}`;
                }

                if (selectedPosition !== -1) {
                    button.disabled = true;
                }

                button.addEventListener("click", function () {
                    if (selectedOrder.includes(index)) {
                        return;
                    }

                    selectedOrder.push(index);
                    answers[current] = [...selectedOrder];

                    renderOrderQuestion(question);
                });

                optionsDiv.appendChild(button);
            });

            refreshOrderStatus();
        }


        // =====================================================
        // NAVIGASI SOAL
        // =====================================================

        function nextQuestion() {
            if (current < questions.length - 1) {
                current++;
                loadQuestion();
                return;
            }

            const confirmation = confirm(
                "Anda berada di soal terakhir. Selesaikan ujian sekarang?"
            );

            if (confirmation) {
                finishExam();
            }
        }

        function previousQuestion() {
            if (current > 0) {
                current--;
                loadQuestion();
            }
        }


        // =====================================================
        // TIMER
        // =====================================================

        function startTimer() {
            const timerInterval = setInterval(function () {
                if (examFinished) {
                    clearInterval(timerInterval);
                    return;
                }

                timeLeft--;

                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;

                document.getElementById("timer").innerText =
                    `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Waktu ujian telah habis.");
                    finishExam();
                }
            }, 1000);
        }


        // =====================================================
        // PEMERIKSAAN JAWABAN
        // =====================================================

        function calculateCorrectAnswers() {
            let correct = 0;

            answers.forEach(function (userAnswer, index) {
                const correctAnswer =
                    questions[index].answer;

                if (Array.isArray(correctAnswer)) {
                    if (
                        Array.isArray(userAnswer) &&
                        arraysEqual(userAnswer, correctAnswer)
                    ) {
                        correct++;
                    }

                    return;
                }

                if (userAnswer === correctAnswer) {
                    correct++;
                }
            });

            return correct;
        }


        // =====================================================
        // SELESAI UJIAN
        // =====================================================
    function arraysEqual(firstArray, secondArray) {
        if (!Array.isArray(firstArray) || !Array.isArray(secondArray)) {
            return false;
        }

        if (firstArray.length !== secondArray.length) {
            return false;
        }

        return firstArray.every(function (value, index) {
            return value === secondArray[index];
        });
    }


    function calculateExamScore() {
        let tataBahasa = 0;
        let dokkai = 0;
        let kanji = 0;
        let kijutsu = 0;

        let score = 0;

        answers.forEach(function (userAnswer, index) {
            const correctAnswer = questions[index].answer;

            let isCorrect = false;

            /*
             * Soal biasa:
             * answer: 1
             */
            if (!Array.isArray(correctAnswer)) {
                isCorrect = userAnswer === correctAnswer;
            }

            /*
             * Soal susun kalimat:
             * answer: [2, 3, 0, 1]
             */
            if (Array.isArray(correctAnswer)) {
                isCorrect = arraysEqual(
                    userAnswer,
                    correctAnswer
                );
            }

            if (!isCorrect) {
                return;
            }

            score++;

            if (index < 30) {
                tataBahasa++;
            } else if (index < 46) {
                dokkai++;
            } else if (index < 66) {
                kanji++;
            } else {
                kijutsu++;
            }
        });

        /*
         * Nilai persentase setiap kompetensi
         */
        const nilaiTata =
            Math.round((tataBahasa / 30) * 100);

        const nilaiDokkai =
            Math.round((dokkai / 16) * 100);

        const nilaiKanji =
            Math.round((kanji / 20) * 100);

        const nilaiKijutsu =
            Math.round((kijutsu / 8) * 100);

        /*
         * Sistem custom 350 poin
         */
        const pointTata = tataBahasa * 5;
        const pointDokkai = dokkai * 5;
        const pointKanji = kanji * 4;
        const pointKijutsu = kijutsu * 5;

        const totalPoint =
            pointTata +
            pointDokkai +
            pointKanji +
            pointKijutsu;

        const nilaiTotal =
            Math.round((totalPoint / 350) * 100);

        return {
            tataBahasa,
            dokkai,
            kanji,
            kijutsu,
            score,

            nilaiTata,
            nilaiDokkai,
            nilaiKanji,
            nilaiKijutsu,

            pointTata,
            pointDokkai,
            pointKanji,
            pointKijutsu,

            totalPoint,
            nilaiTotal
        };
    }
        function finishExam() {
            if (examFinished) {
                return;
            }

            examFinished = true;
            examStarted = false;

            if (document.fullscreenElement) {
                document.exitFullscreen().catch(function (error) {
                    console.warn("Gagal keluar fullscreen:", error);
                });
            }

            const correct =
                calculateCorrectAnswers();

            const finalScore =
                Math.round((correct / questions.length) * 100);

            let status = "Aman";
            let badgeClass = "safe";

            if (totalRiskScore >= 30 && totalRiskScore < 60) {
                status = "Perlu Perhatian";
                badgeClass = "warning";
            } else if (totalRiskScore >= 60) {
                status = "Indikasi Kecurangan";
                badgeClass = "danger";
            }

            /*
             * Ganti URL berikut dengan URL Web App Google Apps Script Anda.
             */
            const googleScriptUrl =
                "URL_GOOGLE_SCRIPT_ANDA";

            if (
                googleScriptUrl &&
                googleScriptUrl !== "URL_GOOGLE_SCRIPT_ANDA"
            ) {
                fetch(googleScriptUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nama: studentName,
                        skor: finalScore,
                        benar: correct,
                        total_soal: questions.length,
                        risk_score: totalRiskScore,
                        logs: activityLogs,
                        answers: answers
                    })
                }).catch(function (error) {
                    console.error("Gagal mengirim data:", error);
                });
            }

            document.getElementById("examContainer").style.display =
                "none";

            const result =
                document.getElementById("result");

            result.style.display = "block";

            const logsHtml = activityLogs.length > 0
                ? activityLogs
                    .map(function (log) {
                        return `
                    [${log.time}]
                    ${log.event}
                    (+${log.penalty})
                `;
                    })
                    .join("<br>")
                : "Tidak ada aktivitas mencurigakan.";

            result.innerHTML = `
        <h2>Hasil Ujian Akhir</h2>

        <p>
            Nama:
            <b>${escapeHtml(studentName)}</b>
        </p>

        <p>
            Jawaban benar:
            <b>${correct} dari ${questions.length}</b>
        </p>

        <p>
            Skor Akademik:
            <b>${finalScore}</b>
        </p>

        <hr>

        <p>
            Status Integritas:
            <span class="status-badge ${badgeClass}">
                ${status}
            </span>
        </p>

        <p>
            Total Risk Score:
            <b>${totalRiskScore}</b>
        </p>

        <div class="log-box">
            <b>Log Aktivitas Terperinci:</b>
            <br>
            ${logsHtml}
        </div>
    `;
        }


        // =====================================================
        // KEAMANAN DASAR OUTPUT NAMA
        // =====================================================

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value;
            return div.innerHTML;
        }
    </script>
